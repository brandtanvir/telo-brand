<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Telo | Logo reveal</title>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/tokens.css">
<style>
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;background:#0E3A2D;overflow:hidden}
  .stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:radial-gradient(50% 55% at 50% 48%,#17503E 0%,#0E3A2D 60%,#082519 100%);font-family:var(--f-sans);color:var(--bone)}
  .glow{position:absolute;left:50%;top:48%;width:1100px;height:1100px;margin:-550px 0 0 -550px;border-radius:50%;background:radial-gradient(closest-side,rgba(201,242,107,.22),rgba(201,242,107,0));opacity:0}
  svg.mark{position:absolute;left:50%;top:50%;width:900px;transform:translate(-50%,-58%);overflow:visible}
  .tag{position:absolute;left:0;right:0;top:712px;text-align:center;font-size:54px;font-weight:300;letter-spacing:-.03em;opacity:0}
  .tag em{font-family:var(--f-serif);font-style:italic;color:var(--lime)}
  .corner{position:absolute;bottom:56px;font-family:var(--f-mono);font-size:16px;letter-spacing:.06em;text-transform:uppercase;color:rgba(245,243,234,.45);opacity:0}
  .c1{left:72px}.c2{right:72px}
</style>
</head>
<body>
<div class="stage">
  <div class="glow"></div>
  <svg class="mark" viewBox="-1 18 181 88" fill="none">
    <g stroke="#F5F3EA" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round">
      <path class="ln" pathLength="1" d="M12 24V86Q12 100 26 100H29"/>
      <path class="ln" pathLength="1" d="M3 56H28"/>
      <path class="ln" pathLength="1" d="M41 78H85A22 22 0 1 0 79.85 92.14"/>
      <path class="ln" pathLength="1" d="M104 24V86Q104 100 118 100"/>
      <g id="o">
        <circle class="trk" cx="151" cy="78" r="22" stroke="rgba(245,243,234,.1)"/>
        <path class="ring" pathLength="1" d="M172.35 72.68A22 22 0 1 1 156.32 56.65"/>
        <circle class="dot" cx="166.56" cy="62.44" r="4.6" fill="#C9F26B" stroke="none"/>
      </g>
    </g>
  </svg>
  <p class="tag">Add years. <em>Add life to them.</em></p>
  <span class="corner c1">Telo · Preventive longevity</span><span class="corner c2">DesignMonks</span>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
  gsap.set('.ln,.ring', { strokeDasharray: 1, strokeDashoffset: 1 });
  gsap.set('.dot', { scale: 0, transformOrigin: '50% 50%' });
  gsap.set('.trk', { opacity: 0 });
  gsap.set('.ln,.ring', { opacity: 0 });
  gsap.set('#o', { svgOrigin: '151 78', scale: 2.1, x: -61.5, y: -16 });
  const tl = gsap.timeline({ paused: true })
    .to('.trk', { opacity: 1, duration: .3 }, 0)
    .to('.glow', { opacity: 1, duration: 1.4, ease: 'power2.out' }, 0)
    .set('.ring', { opacity: 1 }, .15)
    .to('.ring', { strokeDashoffset: 0, autoRound: false, duration: 1.3, ease: 'power2.inOut' }, .15)
    .to('.dot', { scale: 1, duration: .55, ease: 'back.out(4)' }, 1.4)
    .to('#o', { scale: 1, x: 0, y: 0, duration: 1.1, ease: 'expo.inOut' }, 2.05)
    .to('.trk', { opacity: 0, duration: .4 }, 2.3)
    .set('.ln', { opacity: 1, stagger: .14 }, 2.55)
    .to('.ln', { strokeDashoffset: 0, autoRound: false, duration: .9, stagger: .14, ease: 'power2.inOut' }, 2.55)
    .to('.tag', { opacity: 1, y: -10, duration: 1, ease: 'expo.out' }, 3.7)
    .to('.corner', { opacity: 1, duration: .8 }, 3.9)
    .to({}, { duration: 1.4 });
  window.__duration = tl.duration();
  window.__seek = t => tl.time(t, false);
  if (!/capture/.test(location.search)) tl.repeat(-1).repeatDelay(.6).play();
</script>
</body>
</html>
